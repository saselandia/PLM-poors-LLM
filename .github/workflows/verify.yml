name: Verify PLM
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - run: node --test test/model.test.mjs test/store.test.mjs test/launchers.test.mjs test/start-desktop.test.mjs test/context.test.mjs test/context-revisions.test.mjs test/continue.test.mjs
